<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main>
        <h1>Registro de la biblioteca</h1>
        <form action="#" class="formulario">
            <fieldset>
                <legend>Datos Personales</legend>
                <div class="campo">
                    <label for="nombre">Nombre Comleto:</label>
                    <input type="text" id="nombre" name="nombre" required>
                </div>

                <div class="campo">
                    <label for="documento">Documento</label>
                    <input type="text" id="documento" name="documento" required>
                </div>

                <div class="campo">
                    <label for="correo">Correo Electronico:</label>
                    <input type="text" id="correo" name="correo" required>
                </div>

                <div class="campo">
                    <label for="nacimiento">Fecha de nacimiento:</label>
                    <input type="date" id="nacimiento" name="nacimiento"
                    min="1900-01-01">
                </div>

                <div class="campo">
                    <label for="edad">Edad:</label>
                    <input type="number" id="edad" name="edad" min="0" max="120">
                </div>

                <div class="campo">
                    <label for="clave">Contraseña:</label>
                    <input type="password" id="clave" name="clave" required minlength="8">
                </div>
            </fieldset>

            <fieldset>
                <legend>Tu perfil</legend>

                <div class="campo">
                    <label for="tipo">Tipo de usuario</label>
                    <select id="tipio" name="tipo" required>
                      <option value="">Elige una opción</option>
                      <option value="aprendiz">Aprendiz</option>
                      <option value="instructor">Instructor</option>
                      <option value="visitante">Visitante</option>
                    </select>
                </div>
            </fieldset>

            <fieldset class="grupo">
                <legend >sede</legend>
                <label for="norte" class="opción">
                    <input type="radio" name="sede" id="norte" value="norte" checked>Norte
                </label>

                <label for="centro" class="opción">
                    <input type="radio" name="sede" id="centro" value="centro">Centro
                </label>

                <label for="sur" class="opción">
                    <input type="radio" name="sede" id="sur" value="sur">Sur
                </label>
            </fieldset>

            <fieldset class="grupo">
                <legend>Temas que te interesan</legend>
                <label for="novela" class="opción">
                    <input type="checkbox" name="temas" id="novela" value="novela">Novelas
                </label>
                <label for="ciencia" class="opción">
                    <input type="checkbox" name="temas" id="ciencia" value="ciencia">Ciencia
                </label>
                <label for="tecnologia" class="opción">
                    <input type="checkbox" name="temas" id="tecnologia" value="tecnologia">Tecnologia
                </label>

            <div class="campo">
                <label for="comentario">¿que libro te gustaria que tuvieramos</label>
                <textarea name="comentario" id="comentario" rows="4"></textarea>
            </div>

            </fieldset>

            <button type="submit" class="boton">Registrarse</button>
        </form>
</main>
</body>
</html>
